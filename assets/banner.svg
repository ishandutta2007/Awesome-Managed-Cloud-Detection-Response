<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>

    <!-- Cloud Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#4facfe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Radar Pulse Gradient -->
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cyber Grid Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic / Animated Scanning Radar Lines & Rings (strictly in background) -->
  <g transform="translate(1040, 180)" opacity="0.45">
    <circle r="140" fill="url(#radarPulse)">
      <animate attributeName="r" values="60;140;60" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
    <circle r="80" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="110" y2="-70" stroke="#00f2fe" stroke-width="2" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </line>
    <!-- Detected Threat Pulsing Node -->
    <circle cx="55" cy="-35" r="4" fill="#ef4444" filter="url(#softGlow)">
      <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glowing Stream / Network Flow in Background -->
  <path d="M -50 260 Q 250 290 550 240 T 1150 260" fill="none" stroke="url(#cyberLine)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="d" values="M -50 260 Q 250 290 550 240 T 1150 260; M -50 250 Q 250 220 550 260 T 1150 240; M -50 260 Q 250 290 550 240 T 1150 260" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M -50 280 Q 300 230 650 270 T 1250 270" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3">
    <animate attributeName="d" values="M -50 280 Q 300 230 650 270 T 1250 270; M -50 290 Q 300 320 650 250 T 1250 280; M -50 280 Q 300 230 650 270 T 1250 270" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Floating Dynamic Particle Dots -->
  <circle cx="180" cy="80" r="3" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="50" r="2.5" fill="#818cf8" opacity="0.5">
    <animate attributeName="cy" values="50;62;50" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="90" r="3.5" fill="#00f2fe" opacity="0.7">
    <animate attributeName="cy" values="90;78;90" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Badge Pill -->
  <g transform="translate(60, 42)">
    <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="18" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1">CURATED THREAT INTELLIGENCE</text>
  </g>

  <!-- Title & Subtitle in Foreground (Crisp & High Contrast) -->
  <text x="60" y="125" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Managed Cloud Detection &amp; Response
  </text>
  
  <text x="60" y="165" fill="#94a3b8" font-size="16.5" font-weight="500" letter-spacing="0.2">
    24/7 Multi-Cloud SOC Monitoring, Threat Hunting &amp; Open-Source CDR Tooling
  </text>

  <!-- Interactive / Modern Feature Metric Badges -->
  <!-- Pill 1: Multi-Cloud -->
  <g transform="translate(60, 205)">
    <rect width="185" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="26" fill="#38bdf8" font-size="14" font-weight="700">☁️ Multi-Cloud MDR</text>
  </g>

  <!-- Pill 2: 24/7 SOC Ops -->
  <g transform="translate(260, 205)">
    <rect width="195" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="26" fill="#a855f7" font-size="14" font-weight="700">🛡️ 24/7/365 Hunting</text>
  </g>

  <!-- Pill 3: Automated Containment -->
  <g transform="translate(470, 205)">
    <rect width="195" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="26" fill="#00f2fe" font-size="14" font-weight="700">⚡ Rapid Containment</text>
  </g>

  <!-- Pill 4: Open CDR -->
  <g transform="translate(680, 205)">
    <rect width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    <text x="16" y="26" fill="#10b981" font-size="14" font-weight="700">🔓 Open-Source Tooling</text>
  </g>

  <!-- Bottom Stat Bar / Accent Divider -->
  <line x1="60" y1="285" x2="940" y2="285" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="318" fill="#64748b" font-size="13" font-weight="500">
    <tspan fill="#38bdf8" font-weight="600">AWS</tspan> • <tspan fill="#60a5fa" font-weight="600">Azure</tspan> • <tspan fill="#f59e0b" font-weight="600">Google Cloud</tspan> • <tspan fill="#ec4899" font-weight="600">Kubernetes</tspan> • Control Plane &amp; Workload Protection
  </text>
</svg>